backend:
  name: github
  repo: opennorthwest/opennorthwest
  branch: main
  base_url: https://sveltia-cms-auth.snowy-sun-12a9.workers.dev

site_url: https://opennorthwest.pages.dev

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "navigation"
    label: "Navigation"
    description: "Main site menu shown in the header. Drag to reorder items."
    files:
      - name: "main_menu"
        label: "Main Menu"
        file: "src/config/menu.json"
        fields:
          - label: "Main Nav"
            name: "main"
            widget: "list"
            summary: "{{fields.name}} → {{fields.url}}"
            fields:
              - { label: "Label", name: "name", widget: "string", hint: "Text shown in the menu." }
              - { label: "URL", name: "url", widget: "string", hint: "Where this menu item links to. Use /path for internal pages or full https:// URLs for external links." }
              - { label: "Open in new tab", name: "target", widget: "select", options: ["_blank"], required: false, hint: "Set to _blank for external links." }
              - { label: "Has Dropdown", name: "hasChildren", widget: "boolean", default: false, required: false, hint: "Enable to add sub-items below this menu item." }
              - label: "Dropdown Items"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.name}} → {{fields.url}}"
                fields:
                  - { label: "Label", name: "name", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

  - name: "main_page"
    label: "Main Page"
    description: "The site's homepage (shown at /). This is what visitors see when they arrive at opennorthwest.org."
    files:
      - name: "main_page"
        label: "Main Page"
        file: "src/content/pages/index.md"
        fields: &page_fields
          - { label: "Title", name: "title", widget: "string", hint: "Appears in the browser tab and as the page heading." }
          - { label: "Description", name: "description", widget: "string", required: false, hint: "Used for search engines and social media previews." }
          - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false, hint: "When checked, this page is hidden from the live site." }
          - { label: "Show Hero", name: "show_hero", widget: "boolean", default: false, required: false, hint: "Adds a large banner image and headline at the top of the page." }
          - label: "Hero"
            name: "hero"
            widget: "object"
            required: false
            condition:
              field: "show_hero"
              value: true
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - label: "Layout"
                name: "layout"
                widget: "select"
                default: "full-bleed"
                required: false
                options:
                  - { label: "Full Bleed", value: "full-bleed" }
              - { label: "Background Image", name: "image", widget: "image", required: false }
              - label: "CTAs"
                name: "ctas"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "string", required: false }
                  - { label: "Target", name: "target", widget: "string", required: false }
          - { label: "Show Home Sections", name: "show_home_sections", widget: "boolean", default: false, required: false, hint: "Adds the 'Who We Are' and Badge sections (typically only used on the homepage)." }
          - label: "Who We Are"
            name: "who_we_are"
            widget: "object"
            required: false
            condition:
              field: "show_home_sections"
              value: true
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - label: "Content"
                name: "content"
                widget: "list"
                required: false
                field: { label: "Paragraph", name: "paragraph", widget: "string", required: false }
              - label: "CTAs"
                name: "ctas"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "string", required: false }
          - label: "Badge"
            name: "badge"
            widget: "object"
            required: false
            condition:
              field: "show_home_sections"
              value: true
            fields:
              - { label: "Link", name: "link", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "string", required: false }
              - { label: "Alt", name: "alt", widget: "string", required: false }
              - { label: "Width", name: "width", widget: "number", required: false, value_type: "int" }
              - { label: "Height", name: "height", widget: "number", required: false, value_type: "int" }
          - { label: "Body", name: "body", widget: "markdown", hint: "Main page content. Use the formatting toolbar for headings, links, lists, and images." }

  - name: "events"
    label: "Events"
    label_singular: "Event Page"
    description: "Events landing page (index) and event sub-pages."
    folder: "src/content/pages/events"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "draft"]
    fields: *page_fields

  - name: "contact_us"
    label: "Contact Us"
    label_singular: "Contact Page"
    description: "Contact landing page (index) and contact sub-pages (incident reports, suggestions, venue requests)."
    folder: "src/content/pages/contact-us"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "draft"]
    fields: *page_fields

  - name: "get_involved"
    label: "Get Involved"
    label_singular: "Get Involved Page"
    description: "Get Involved landing page (index) and volunteer resources."
    folder: "src/content/pages/get-involved"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "draft"]
    fields: *page_fields

  - name: "about_us"
    label: "About Us"
    label_singular: "About Us Page"
    description: "About Us landing page (index), Meet the Leadership, Valkyries, and Posting Policy."
    folder: "src/content/pages/about-us"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "draft"]
    fields: *page_fields

  - name: "pages"
    label: "Other Pages"
    label_singular: "Page"
    description: "Standalone pages that don't belong to a specific section (Conduct Guidelines, About You, etc.). The homepage and pages with sub-pages live in their own collections above."
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "draft"]
    view_filters:
      - { label: "Drafts only", field: "draft", pattern: true }
      - { label: "Published only", field: "draft", pattern: false }
      - { label: "Has Hero banner", field: "show_hero", pattern: true }
    fields: *page_fields

  - name: "site_settings"
    label: "Site Settings"
    description: "Logo, site title, footer text, and other site-wide settings."
    files:
      - name: "general"
        label: "General"
        file: "src/config/config.json"
        fields:
          - label: "Site Identity"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site Title", name: "title", widget: "string", hint: "Used in browser tabs and as fallback metadata." }
              - { label: "Logo Text", name: "logo_text", widget: "string", hint: "Text shown next to or instead of the logo image." }
              - { label: "Logo Image", name: "logo", widget: "image", hint: "Header logo. Recommended ~200×60px transparent PNG." }
              - { label: "Logo Width", name: "logo_width", widget: "string", hint: "Logo display width in pixels (e.g. 198)." }
              - { label: "Logo Height", name: "logo_height", widget: "string", hint: "Logo display height in pixels (e.g. 62)." }
              - { label: "Favicon", name: "favicon", widget: "image", hint: "Small icon shown in browser tabs (favicon.png or .ico)." }
              - { label: "Base URL", name: "base_url", widget: "string", hint: "Production URL of the site (advanced — only change if your domain changes)." }
              - { label: "Base Path", name: "base_path", widget: "string", default: "/", hint: "Sub-path the site is hosted at (advanced)." }
              - { label: "Trailing Slash", name: "trailing_slash", widget: "boolean", default: false, hint: "Add a trailing slash to all URLs (advanced)." }
          - label: "Header Button"
            name: "nav_button"
            widget: "object"
            hint: "Optional call-to-action button shown in the header."
            fields:
              - { label: "Show Button", name: "enable", widget: "boolean", default: false }
              - { label: "Button Label", name: "label", widget: "string", required: false }
              - { label: "Button Link", name: "link", widget: "string", required: false }
          - label: "Footer & Form"
            name: "params"
            widget: "object"
            fields:
              - { label: "Footer Content", name: "footer_content", widget: "text", required: false, hint: "Text shown in the footer (HTML allowed)." }
              - { label: "Copyright", name: "copyright", widget: "string", required: false, hint: "Copyright line shown at the bottom." }
              - { label: "Contact Form Action URL", name: "contact_form_action", widget: "string", required: false, hint: "Form submission endpoint (e.g. a Formspree or Netlify Forms URL)." }
          - label: "SEO / Social Sharing"
            name: "metadata"
            widget: "object"
            fields:
              - { label: "Author", name: "meta_author", widget: "string", hint: "Default author shown in metadata." }
              - { label: "Default Description", name: "meta_description", widget: "text", hint: "Used when a page doesn't set its own description." }
              - { label: "Default Share Image", name: "meta_image", widget: "image", hint: "Image shown when the site is shared on social media." }
          - label: "Analytics"
            name: "google_tag_manager"
            widget: "object"
            hint: "Google Tag Manager / Analytics."
            fields:
              - { label: "Enable GTM", name: "enable", widget: "boolean", default: false }
              - { label: "GTM ID", name: "gtm_id", widget: "string", required: false, hint: "Format: GTM-XXXXXX" }
          - label: "Display Settings"
            name: "settings"
            widget: "object"
            hint: "Listing/pagination settings."
            fields:
              - { label: "Items per page", name: "pagination", widget: "number", default: 4, value_type: "int" }
              - { label: "Summary length (characters)", name: "summary_length", widget: "number", default: 200, value_type: "int" }

  - name: "theme"
    label: "Theme"
    description: "Colors and fonts. Advanced — changes here affect the look of the entire site."
    files:
      - name: "theme"
        label: "Colors & Fonts"
        file: "src/config/theme.json"
        fields:
          - label: "Colors"
            name: "colors"
            widget: "object"
            fields:
              - label: "Default"
                name: "default"
                widget: "object"
                fields:
                  - label: "Theme Colors"
                    name: "theme_color"
                    widget: "object"
                    fields:
                      - { label: "Primary", name: "primary", widget: "color", hint: "Main brand color (buttons, links, accents)." }
                      - { label: "Body Background", name: "body", widget: "color" }
                      - { label: "Border", name: "border", widget: "color" }
                      - { label: "Light Accent", name: "light", widget: "color" }
                  - label: "Text Colors"
                    name: "text_color"
                    widget: "object"
                    fields:
                      - { label: "Body Text", name: "text", widget: "color" }
                      - { label: "Headings", name: "text-dark", widget: "color" }
          - label: "Fonts"
            name: "fonts"
            widget: "object"
            fields:
              - label: "Font Family"
                name: "font_family"
                widget: "object"
                fields:
                  - { label: "Primary Font", name: "primary", widget: "string", hint: "Google Fonts spec, e.g. Raleway:wght@100;300;400;500;600;700" }
                  - { label: "Font Type", name: "primary_type", widget: "select", options: ["sans-serif", "serif", "monospace"] }
              - label: "Font Sizes"
                name: "font_size"
                widget: "object"
                fields:
                  - { label: "Base size (px)", name: "base", widget: "string", default: "16" }
                  - { label: "Scale ratio", name: "scale", widget: "string", default: "1.2", hint: "Each heading level multiplies by this (1.2 = subtle, 1.5 = dramatic)." }
